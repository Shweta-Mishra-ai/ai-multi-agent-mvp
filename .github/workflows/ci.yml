name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # render_page (agentos/tools/browser.py) launches Chromium in a
      # subprocess - install it here too so its end-to-end test (a real
      # render, not a mock) can actually run in CI, the same as the
      # Dockerfile does for production.
      - run: playwright install --with-deps chromium
      - run: python -m pytest tests/ -q --cov=agentos --cov=api --cov-fail-under=80
        env:
          OPENAI_API_KEY: test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
